include:
  - project: 'infra/common-ci'
    file: 'ci/common-js-ci.yml'
    ref: 'master'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

    - if: $CI_COMMIT_TAG
      when: always

    - when: never
