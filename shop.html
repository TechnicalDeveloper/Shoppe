<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SHOPPE</title>
    <link rel="stylesheet" href="src/styles/shop.css">
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans:400,500,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <header class="topbar">
        <div class="topbar__container container">
            <div class="topbar__menu-toggle" aria-label="Toggle menu">
                <img src="src/assets/svg/icon-burger.svg" alt="Menu" class="topbar__menu-icon"/>
                <div class="topbar__menu-dropdown">
                    <a href="/" class="topbar__menu-dropdown-link">HOME</a>
                    <a href="/shop.html" class="topbar__menu-dropdown-link">SHOP</a>
                </div>
            </div>
            <a href="index.html" class="topbar__logo" aria-label="Shoppe">
                <img src="src/assets/svg/header_logo.svg" alt="Shoppe Logo" class="topbar__logo-img"/>
            </a>
            <nav class="topbar__nav">
                <ul class="topbar__menu">
                    <li class="topbar__menu-item">
                        <a href="/shop.html" class="topbar__menu-link">Shop</a>
                    </li>
                </ul>
                <span class="topbar__divider"></span>
                <a href="#" class="topbar__icon topbar__icon_cart header__icon header__icon_cart" aria-label="Корзина"
                   lang="ru">
                    <img src="src/assets/svg/header_shopping-cart.svg" alt="Cart"
                         class="topbar__icon-img header__icon-img"/>
                    <span class="header__cart-count">1</span>
                </a>
                <a href="#" class="topbar__icon topbar__icon_user" aria-label="Профиль" lang="ru">
                    <img src="src/assets/svg/header_icon-color.svg" alt="User" class="topbar__icon-img"/>
                </a>
            </nav>
        </div>
    </header>
    <main>
        <div class="shop-page">
            <div class="shop-page__header">
                <h1 class="shop-page__title">Shop The Latest</h1>
                <button type="button" class="shop-page__filters-toggle">Filters</button>
            </div>
            <div class="shop-page__main">
                <aside class="shop-page__sidebar">
                    <div class="shop-page__search-wrapper">
                        <input class="shop-page__search" type="text" placeholder="Search&hellip;"
                               aria-label="Search products"/>
                        <img src="src/assets/svg/search.svg" alt="Search" class="shop-page__search-icon"
                             aria-hidden="true"/>
                    </div>
                    <div class="shop-page__sort">
                        <select id="sort" class="shop-page__sort-select">
                            <option>Sort By</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                        </select>
                    </div>
                    <div class="shop-page__filter">
                        <label class="shop-page__filter-label">
                            <span>On sale</span>
                            <input type="checkbox" class="shop-page__filter-switch"/>
                            <span class="shop-page__switch"></span>
                        </label>
                    </div>
                    <div class="shop-page__filter">
                        <label class="shop-page__filter-label">
                            <span>In stock</span>
                            <input type="checkbox" class="shop-page__filter-switch"/>
                            <span class="shop-page__switch"></span>
                        </label>
                    </div>
                </aside>
                <div class="shop-page__products">
                    <div class="shop-page__grid">
                        <div class="shop-card shop-card--onsale">
                            <span class="shop-card__badge">- 31 %</span>
                            <div class="shop-card__img shop-card__img--lira">
                                <div class="shop-latest__actions">
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Add to cart">
                                        <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="View">
                                        <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Wishlist">
                                        <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                                    </button>
                                </div>
                            </div>
                            <div class="shop-card__info">
                                <div class="shop-card__name">Lira Earrings</div>
                                <div class="shop-card__prices">
                                    <span class="shop-card__price shop-card__price--old">$ 29,00</span>
                                    <span class="shop-card__price shop-card__price--new">$ 20,00</span>
                                </div>
                            </div>
                        </div>
                        <div class="shop-card">
                            <div class="shop-card__img shop-card__img--hal">
                                <div class="shop-latest__actions">
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Add to cart">
                                        <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="View">
                                        <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Wishlist">
                                        <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                                    </button>
                                </div>
                            </div>
                            <div class="shop-card__info">
                                <div class="shop-card__name">Hal Earrings</div>
                                <div class="shop-card__prices">
                                    <span class="shop-card__price shop-card__price--new">$ 25,00</span>
                                </div>
                            </div>
                        </div>
                        <div class="shop-card">
                            <div class="shop-card__img shop-card__img--kaede">
                                <div class="shop-latest__actions">
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Add to cart">
                                        <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="View">
                                        <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Wishlist">
                                        <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                                    </button>
                                </div>
                            </div>
                            <div class="shop-card__info">
                                <div class="shop-card__name">Kaede Hair Pin Set Of 3</div>
                                <div class="shop-card__prices">
                                    <span class="shop-card__price shop-card__price--new">$ 30,00</span>
                                </div>
                            </div>
                        </div>
                        <div class="shop-card">
                            <div class="shop-card__img shop-card__img--hairpin">
                                <div class="shop-latest__actions">
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Add to cart">
                                        <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="View">
                                        <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Wishlist">
                                        <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                                    </button>
                                </div>
                            </div>
                            <div class="shop-card__info">
                                <div class="shop-card__name">Hair Pin Set of 3</div>
                                <div class="shop-card__prices">
                                    <span class="shop-card__price shop-card__price--new">$ 30,00</span>
                                </div>
                            </div>
                        </div>
                        <div class="shop-card shop-card--soldout">
                            <span class="shop-card__badge shop-card__badge--soldout">Sold out</span>
                            <div class="shop-card__img shop-card__img--plaine">
                                <div class="shop-latest__actions">
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Add to cart"
                                            disabled>
                                        <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="View">
                                        <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Wishlist">
                                        <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                                    </button>
                                </div>
                            </div>
                            <div class="shop-card__info">
                                <div class="shop-card__name">Plaine Necklace</div>
                                <div class="shop-card__prices">
                                    <span class="shop-card__price shop-card__price--new">$ 30,00</span>
                                </div>
                            </div>
                        </div>
                        <div class="shop-card">
                            <div class="shop-card__img shop-card__img--yuki">
                                <div class="shop-latest__actions">
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Add to cart">
                                        <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="View">
                                        <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                                    </button>
                                    <button type="button" class="shop-latest__icon-btn" aria-label="Wishlist">
                                        <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                                    </button>
                                </div>
                            </div>
                            <div class="shop-card__info">
                                <div class="shop-card__name">Yuki Hair Pin Set of 3</div>
                                <div class="shop-card__prices">
                                    <span class="shop-card__price shop-card__price--new">$ 20,00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="shop-page__pagination">
                        <button type="button" class="shop-page__page shop-page__page--prev">Prev</button>
                        <button type="button" class="shop-page__page shop-page__page--active">1</button>
                        <button type="button" class="shop-page__page">2</button>
                        <button type="button" class="shop-page__page">3</button>
                        <button type="button" class="shop-page__page shop-page__page--next">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="shop-footer">
        <div class="shop-footer__container">
            <div class="shop-footer__line"></div>
            <div class="shop-footer__bottom">
                <div class="shop-footer__copy">© 2025 Shelly</div>
                <div class="shop-footer__social">
                    <img src="src/assets/svg/footer-icons.svg" alt="Social icons" class="footer__social-icons"/>
                    <div class="shop-footer__social-overlay">
                        <a href="#" class="shop-footer__social-link" aria-label="LinkedIn"></a>
                        <a href="#" class="shop-footer__social-link" aria-label="Facebook"></a>
                        <a href="#" class="shop-footer__social-link" aria-label="Instagram"></a>
                        <a href="#" class="shop-footer__social-link" aria-label="Twitter"></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</div>

<script>
    const burger = document.querySelector('.topbar__menu-toggle');
    burger.addEventListener('click', () => {
        burger.classList.toggle('open');
    });
</script>

</body>
</html>
