<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOPPE | Главная</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans:400,500,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <a href="index.html" class="header__logo" aria-label="Shoppe">
          <img
            src="src/assets/svg/header_logo.svg"
            alt="Shoppe Logo"
            class="header__logo-img"
          />
        </a>
        <nav class="header__nav">
          <ul class="header__menu">
            <li class="header__menu-item">
              <a href="/src/pages/shop.html" class="header__menu-link">Shop</a>
            </li>
          </ul>
          <span class="header__divider"></span>
          <a
            href="#"
            class="header__icon header__icon_cart"
            aria-label="Корзина"
          >
            <img
              src="src/assets/svg/header_shopping-cart.svg"
              alt="Cart"
              class="header__icon-img"
            />
            <span class="header__cart-count">1</span>
          </a>
          <a
            href="#"
            class="header__icon header__icon_user"
            aria-label="Профиль"
          >
            <img
              src="src/assets/svg/header_icon-color.svg"
              alt="User"
              class="header__icon-img"
            />
          </a>
        </nav>
        <div class="header__menu-toggle" aria-label="Toggle menu">
          <img
            src="src/assets/svg/icon-burger.svg"
            alt="Menu"
            class="header__menu-icon"
          />
          <div class="header__menu-dropdown">
            <a href="/" class="header__menu-dropdown-link">HOME</a>
            <a href="/src/pages/shop.html" class="header__menu-dropdown-link"
              >SHOP</a
            >
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <div class="hero__slider">
            <template id="hero-content-template">
              <div class="hero__content">
                <h2 class="hero__title"></h2>
                <div class="hero__price"></div>
                <a href="#" class="hero__btn">View Product</a>
              </div>
            </template>

            <div class="hero__pagination"></div>
          </div>
        </div>
      </section>

  <section class="shop-latest">
    <div class="container">
      <div class="shop-latest__header">
        <h2 class="shop-latest__title">Shop The Latest</h2>
        <a href="/src/pages/shop.html" class="shop-latest__view-all">View All</a>
      </div>
      <div class="shop-latest__grid shop-page__grid"></div>
    </div>
  </section>
</main>

    <footer class="footer">
      <div class="container">
        <div class="footer__line"></div>
        <div class="footer__bottom">
          <div class="footer__copy">© 2025 Shelly</div>
          <div class="footer__social">
            <nav class="footer__social" aria-label="Социальные сети">
              <ul class="footer__social-list">
                <li>
                  <a
                    class="footer__social-link"
                    href="https://www.linkedin.com/company/your-company"
                    target="_blank"
                    rel="noopener"
                    aria-label="LinkedIn"
                    ><img
                      src="src/assets/svg/social/footer_linkin.svg"
                      alt=""
                      aria-hidden="true"
                  /></a>
                </li>
                <li>
                  <a
                    class="footer__social-link"
                    href="https://www.facebook.com/your-page"
                    target="_blank"
                    rel="noopener"
                    aria-label="Facebook"
                    ><img
                      src="src/assets/svg/social/footer_facebook.svg"
                      alt=""
                      aria-hidden="true"
                  /></a>
                </li>
                <li>
                  <a
                    class="footer__social-link"
                    href="https://www.instagram.com/your-handle"
                    target="_blank"
                    rel="noopener"
                    aria-label="Instagram"
                    ><img
                      src="src/assets/svg/social/footer_instagram.svg"
                      alt=""
                      aria-hidden="true"
                  /></a>
                </li>
                <li>
                  <a
                    class="footer__social-link"
                    href="https://twitter.com/your-handle"
                    target="_blank"
                    rel="noopener"
                    aria-label="Twitter"
                    ><img
                      src="src/assets/svg/social/footer_twitter.svg"
                      alt=""
                      aria-hidden="true"
                  /></a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </footer>

<script type="module" src="/src/modules/main.js"></script>
<script>
  const burger = document.querySelector(".header__menu-toggle");
  burger?.addEventListener("click", () => burger.classList.toggle("open"));
</script>
</body>
</html>
