<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SHOPPE</title>
    <link rel="stylesheet" href="src/styles/style.scss">
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans:400,500,700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
    <div class="header__container container">
        <a href="index.html" class="header__logo" aria-label="Shoppe">
            <img src="src/assets/svg/header_logo.svg" alt="Shoppe Logo" class="header__logo-img"/>
        </a>
        <nav class="header__nav">
            <ul class="header__menu">
                <li class="header__menu-item">
                    <a href="/shop.html" class="header__menu-link">Shop</a>
                </li>
            </ul>
            <span class="header__divider"></span>
            <a href="#" class="header__icon header__icon_cart" aria-label="Корзина">
                <img src="src/assets/svg/header_shopping-cart.svg" alt="Cart" class="header__icon-img"/>
            </a>
            <a href="#" class="header__icon header__icon_user" aria-label="Профиль">
                <img src="src/assets/svg/header_icon-color.svg" alt="User" class="header__icon-img"/>
            </a>
        </nav>
        <div class="header__menu-toggle" aria-label="Toggle menu">
            <img src="src/assets/svg/icon-burger.svg" alt="Menu" class="header__menu-icon"/>
            <div class="header__menu-dropdown">
                <a href="/" class="header__menu-dropdown-link">HOME</a>
                <a href="/shop.html" class="header__menu-dropdown-link">SHOP</a>
            </div>
        </div>

    </div>
</header>
<main>
    <section class="hero">
        <div class="container">
            <div class="hero__slider">
                <div class="hero__content">
                    <h2 class="hero__title">Gold big hoops</h2>
                    <div class="hero__price">$ 68,00</div>
                    <a href="#" class="hero__btn">View Product</a>
                </div>
            </div>
        </div>
    </section>
    <section class="shop-latest">
        <div class="container">
            <div class="shop-latest__header">
                <h2 class="shop-latest__title">Shop The Latest</h2>
                <a href="/shop.html" class="shop-latest__view-all">View All</a>
            </div>
            <div class="shop-latest__grid">
                <div class="shop-latest__card">
                    <div class="shop-latest__image">
                        <img src="/src/assets/Lira-Earrings_shop.png" alt="Lira Earrings"/>
                        <span class="shop-latest__badge">-31%</span>
                        <div class="shop-latest__actions">
                            <button class="shop-latest__icon-btn" aria-label="Add to cart">
                                <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="View">
                                <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="Wishlist">
                                <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                            </button>
                        </div>
                        <div class="shop-latest__cta--mobile">
                            <button class="shop-latest__add-to-cart">ADD TO CART</button>
                        </div>
                    </div>
                    <div class="shop-latest__info">
                        <div class="shop-latest__name">Lira Earrings</div>
                        <div class="shop-latest__prices">
                            <span class="shop-latest__price shop-latest__price--old">$ 29,00</span>
                            <span class="shop-latest__price shop-latest__price--new">$ 20,00</span>
                        </div>
                    </div>
                </div>
                <div class="shop-latest__card">
                    <div class="shop-latest__image">
                        <img src="/src/assets/Hal-Earrings_shop.png" alt="Hal Earrings"/>
                        <div class="shop-latest__actions">
                            <button class="shop-latest__icon-btn" aria-label="Add to cart">
                                <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="View">
                                <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="Wishlist">
                                <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                            </button>
                        </div>
                        <div class="shop-latest__cta--mobile">
                            <button class="shop-latest__add-to-cart">ADD TO CART</button>
                        </div>
                    </div>
                    <div class="shop-latest__info">
                        <div class="shop-latest__name">Hal Earrings</div>
                        <div class="shop-latest__prices">
                            <span class="shop-latest__price shop-latest__price--new">$ 30,00</span>
                        </div>
                    </div>
                </div>
                <div class="shop-latest__card">
                    <div class="shop-latest__image">
                        <img src="/src/assets/Kaede-Hair_shop.png" alt="Kaede Hair Pin"/>
                        <div class="shop-latest__actions">
                            <button class="shop-latest__icon-btn" aria-label="Add to cart">
                                <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="View">
                                <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="Wishlist">
                                <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                            </button>
                        </div>
                        <div class="shop-latest__cta--mobile">
                            <button class="shop-latest__add-to-cart">ADD TO CART</button>
                        </div>
                    </div>
                    <div class="shop-latest__info">
                        <div class="shop-latest__name">Kaede Hair Pin</div>
                        <div class="shop-latest__prices">
                            <span class="shop-latest__price shop-latest__price--new">$ 30,00</span>
                        </div>
                    </div>
                </div>
                <div class="shop-latest__card">
                    <div class="shop-latest__image">
                        <img src="/src/assets/Yuki-Hair_shop.png" alt="Yuki Hair Pin"/>
                        <span class="shop-latest__badge">-10%</span>
                        <div class="shop-latest__actions">
                            <button class="shop-latest__icon-btn" aria-label="Add to cart">
                                <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="View">
                                <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="Wishlist">
                                <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                            </button>
                        </div>
                        <div class="shop-latest__cta--mobile">
                            <button class="shop-latest__add-to-cart">ADD TO CART</button>
                        </div>
                    </div>
                    <div class="shop-latest__info">
                        <div class="shop-latest__name">Yuki Hair Pin</div>
                        <div class="shop-latest__prices">
                            <span class="shop-latest__price shop-latest__price--old">$ 29,00</span>
                            <span class="shop-latest__price shop-latest__price--new">$ 25,00</span>
                        </div>
                    </div>
                </div>
                <div class="shop-latest__card">
                    <div class="shop-latest__image">
                        <img src="/src/assets/Plaine-Necklace_shop.png" alt="Plaine Necklace"/>
                        <div class="shop-latest__actions">
                            <button class="shop-latest__icon-btn" aria-label="Add to cart">
                                <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="View">
                                <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="Wishlist">
                                <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>

                            <button class="shop-latest__add-to-cart">ADD TO CART</button>

                        <div class="shop-latest__prices">
                            <span class="shop-latest__price shop-latest__price--new">$ 19,00</span>
                        </div>
                    </div>
                </div>
                <div class="shop-latest__card">
                    <div class="shop-latest__image">
                        <img src="/src/assets/Hair-Pin_shop.png" alt="Hair Pin Set"/>
                        <div class="shop-latest__actions">
                            <button class="shop-latest__icon-btn" aria-label="Add to cart">
                                <img src="/src/assets/svg/cart.svg" alt="Add to cart"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="View">
                                <img src="/src/assets/svg/eye-svgrepo-mini.svg" alt="View"/>
                            </button>
                            <button class="shop-latest__icon-btn" aria-label="Wishlist">
                                <img src="/src/assets/svg/heart-svgrepo-mini.svg" alt="Wishlist"/>
                            </button>
                        </div>
                        <div class="shop-latest__cta--mobile">
                            <button class="shop-latest__add-to-cart">ADD TO CART</button>
                        </div>
                    </div>
                    <div class="shop-latest__info">
                        <div class="shop-latest__name">Hair Pin Set of 3</div>
                        <div class="shop-latest__prices">
                            <span class="shop-latest__price shop-latest__price--new">$ 29,00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<footer class="footer">
    <div class="container">
        <div class="footer__line"></div>
        <div class="footer__bottom">
            <div class="footer__copy">© 2025 Shelly</div>
            <div class="footer__social">
                <img src="src/assets/svg/footer-icons.svg" alt="Социальные иконки" class="footer__social-icons"/>
                <div class="shop-footer__social-overlay">
                    <a href="#" class="shop-footer__social-link" aria-label="LinkedIn"></a>
                    <a href="#" class="shop-footer__social-link" aria-label="Facebook"></a>
                    <a href="#" class="shop-footer__social-link" aria-label="Instagram"></a>
                    <a href="#" class="shop-footer__social-link" aria-label="Twitter"></a>
                </div>
            </div>
        </div>
    </div>
</footer>

<script>
    const burger = document.querySelector('.header__menu-toggle');
    burger.addEventListener('click', () => {
        burger.classList.toggle('open');
    });
</script>

</body>
</html>
